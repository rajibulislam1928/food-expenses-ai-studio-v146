name: Publish Stable GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.4.6)'
        required: true
        default: 'v1.4.15'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_DIR" ] && [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Determine Release Tag
        id: tag_info
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=$INPUT_TAG_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify release tag matches configured app versionName
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag_info.outputs.tag }}
        run: |
          TAG="$RELEASE_TAG"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Release tag must use the vMAJOR.MINOR.PATCH format."
            exit 1
          fi
          TAG_VERSION="${TAG#v}"
          APP_VERSION="$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ -z "$APP_VERSION" ] || [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "Error: Release tag '$TAG' ($TAG_VERSION) does not match configured versionName '$APP_VERSION'."
            exit 1
          fi
          echo "Verified tag $TAG matches versionName $APP_VERSION."

      - name: Verify no release keystores or .env are tracked in git
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -qE '(^|/)\.env$|\.(jks|keystore)$'; then
            echo "Error: Signing keystores or .env must not be committed to a public release tag."
            exit 1
          fi

      - name: Verify release signing secrets are configured
        shell: bash
        env:
          RELEASE_KEYSTORE_GPG_BASE64: ${{ secrets.RELEASE_KEYSTORE_GPG_BASE64 }}
          RELEASE_ENV_GPG_BASE64: ${{ secrets.RELEASE_ENV_GPG_BASE64 }}
          RELEASE_BACKUP_PASSPHRASE: ${{ secrets.RELEASE_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          for name in RELEASE_KEYSTORE_GPG_BASE64 RELEASE_ENV_GPG_BASE64 RELEASE_BACKUP_PASSPHRASE; do
            if [ -z "${!name:-}" ]; then
              echo "Error: Missing release signing secret: $name"
              exit 1
            fi
          done

      - name: Run offline unit and Robolectric tests
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest \
            --tests "com.example.ExampleUnitTest" \
            --tests "com.example.ExampleRobolectricTest" \
            --tests "com.example.data.preferences.*" \
            --tests "com.example.domain.*" \
            --tests "com.example.notifications.*" \
            --tests "com.example.data.repository.MessRepositoryCycleBoundsTest" \
            --tests "com.example.ui.*"

      - name: Decrypt and build signed release artifacts
        shell: bash
        env:
          RELEASE_KEYSTORE_GPG_BASE64: ${{ secrets.RELEASE_KEYSTORE_GPG_BASE64 }}
          RELEASE_ENV_GPG_BASE64: ${{ secrets.RELEASE_ENV_GPG_BASE64 }}
          RELEASE_BACKUP_PASSPHRASE: ${{ secrets.RELEASE_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          SIGNING_DIR="$RUNNER_TEMP/food-expenses-release-signing"
          mkdir -p "$SIGNING_DIR"
          trap 'rm -rf "$SIGNING_DIR"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_GPG_BASE64" | tr -d ' \r\n\t' | base64 --decode > "$SIGNING_DIR/keystore.jks.gpg"
          printf '%s' "$RELEASE_ENV_GPG_BASE64" | tr -d ' \r\n\t' | base64 --decode > "$SIGNING_DIR/signing.env.gpg"
          test -s "$SIGNING_DIR/keystore.jks.gpg"
          test -s "$SIGNING_DIR/signing.env.gpg"
          printf '%s' "$RELEASE_BACKUP_PASSPHRASE" | gpg --batch --yes --no-tty --pinentry-mode loopback --passphrase-fd 0 --output "$SIGNING_DIR/my-upload-key.jks" --decrypt "$SIGNING_DIR/keystore.jks.gpg"
          printf '%s' "$RELEASE_BACKUP_PASSPHRASE" | gpg --batch --yes --no-tty --pinentry-mode loopback --passphrase-fd 0 --output "$SIGNING_DIR/signing.env" --decrypt "$SIGNING_DIR/signing.env.gpg"
          test -s "$SIGNING_DIR/my-upload-key.jks"
          test -s "$SIGNING_DIR/signing.env"
          python3 - "$SIGNING_DIR/signing.env" "$SIGNING_DIR/my-upload-key.jks" <<'PYTHON'
          import os
          import shlex
          import subprocess
          import sys

          source, keystore = sys.argv[1:]
          allowed = {"STORE_PASSWORD", "KEY_PASSWORD"}
          values = {}
          with open(source, encoding="utf-8") as stream:
              for number, raw in enumerate(stream, 1):
                  line = raw.strip()
                  if not line or line.startswith("#"):
                      continue
                  if line.startswith("export "):
                      line = line[7:].lstrip()
                  try:
                      tokens = shlex.split(line, comments=True, posix=True)
                  except ValueError:
                      raise SystemExit(f"Unsupported signing environment syntax on line {number}.")
                  if len(tokens) != 1 or "=" not in tokens[0]:
                      raise SystemExit(f"Unsupported signing environment syntax on line {number}.")
                  key, value = tokens[0].split("=", 1)
                  if key in allowed:
                      if key in values or not value or "\n" in value or "\r" in value:
                          raise SystemExit(f"Invalid or duplicate {key} entry in signing environment.")
                      values[key] = value
          missing = allowed - values.keys()
          if missing:
              raise SystemExit("Signing environment is missing required password entries.")

          build_env = os.environ.copy()
          for name in ("RELEASE_BACKUP_PASSPHRASE", "RELEASE_KEYSTORE_GPG_BASE64", "RELEASE_ENV_GPG_BASE64"):
              build_env.pop(name, None)
          build_env.update(values)
          build_env["KEYSTORE_PATH"] = keystore
          for value in values.values():
              print(f"::add-mask::{value}", flush=True)

          subprocess.run(
              ["keytool", "-list", "-keystore", keystore, "-alias", "upload", "-storepass:env", "STORE_PASSWORD"],
              env=build_env,
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
              check=True,
          )
          subprocess.run(
              ["gradle", "--no-daemon", ":app:assembleRelease", ":app:bundleRelease"],
              env=build_env,
              check=True,
          )
          PYTHON

      - name: Verify Signed Release APK & AAB and Compute SHA-256 Checksums
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag_info.outputs.tag }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Release APK not found at $APK_PATH"
            exit 1
          fi
          if [ ! -f "$AAB_PATH" ]; then
            echo "Error: Release AAB not found at $AAB_PATH"
            exit 1
          fi

          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_DIR" ] || [ ! -d "$SDK_DIR" ]; then
            echo "Error: ANDROID_HOME / ANDROID_SDK_ROOT is not set; cannot locate apksigner."
            exit 1
          fi

          find_apksigner() {
            find "$SDK_DIR/build-tools" -maxdepth 2 \( -type f -o -type l \) -name apksigner 2>/dev/null | sort -V | tail -n 1 || true
          }

          APKSIGNER="$(find_apksigner)"
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -maxdepth 3 \( -type f -o -type l \) -name sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)"
            if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
              echo "apksigner not found; installing Android SDK build-tools;36.0.0..."
              yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
              "$SDKMANAGER" "build-tools;36.0.0"
              APKSIGNER="$(find_apksigner)"
            fi
          fi

          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "Error: apksigner not found under $SDK_DIR/build-tools; refusing to publish without APK signature verification."
            exit 1
          fi

          echo "Verifying APK signature with $APKSIGNER..."
          APK_VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK_PATH")"
          echo "$APK_VERIFY_OUTPUT"
          if echo "$APK_VERIFY_OUTPUT" | grep -qi "CN=Android Debug"; then
            echo "Error: Release APK is signed with the Android Debug certificate; refusing to publish."
            exit 1
          fi

          if ! command -v jarsigner >/dev/null 2>&1; then
            echo "Error: jarsigner not found; refusing to publish without AAB signature verification."
            exit 1
          fi

          echo "Verifying AAB signature with jarsigner..."
          AAB_VERIFY_OUTPUT="$(jarsigner -verify -verbose:summary -certs "$AAB_PATH")"
          echo "$AAB_VERIFY_OUTPUT"
          if ! echo "$AAB_VERIFY_OUTPUT" | grep -q "jar verified." || echo "$AAB_VERIFY_OUTPUT" | grep -qi "jar is unsigned"; then
            echo "Error: Release AAB signature verification failed."
            exit 1
          fi
          if echo "$AAB_VERIFY_OUTPUT" | grep -qi "CN=Android Debug"; then
            echo "Error: Release AAB is signed with the Android Debug certificate; refusing to publish."
            exit 1
          fi

          mkdir -p release-artifacts
          cp "$APK_PATH" "release-artifacts/food-expenses-${TAG}-release.apk"
          cp "$AAB_PATH" "release-artifacts/food-expenses-${TAG}-release.aab"
          cd release-artifacts
          sha256sum "food-expenses-${TAG}-release.apk" "food-expenses-${TAG}-release.aab" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Clean up temporary signing material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/food-expenses-release-signing"

      - name: Upload verified release candidate for manual checks
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: food-expenses-${{ steps.tag_info.outputs.tag }}-release-candidate
          path: release-artifacts/*
          retention-days: 7

      - name: Publish Stable GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: "Food Expenses ${{ steps.tag_info.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/*
