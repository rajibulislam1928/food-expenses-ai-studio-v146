name: Publish Stable GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.4.6)'
        required: true
        default: 'v1.4.6'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_DIR" ] && [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify release tag matches configured app versionName
        shell: bash
        run: |
          TAG="${{ steps.tag_info.outputs.tag }}"
          TAG_VERSION="${TAG#v}"
          APP_VERSION="$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ -z "$APP_VERSION" ] || [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "Error: Release tag '$TAG' ($TAG_VERSION) does not match configured versionName '$APP_VERSION'."
            exit 1
          fi
          echo "Verified tag $TAG matches versionName $APP_VERSION."

      - name: Verify no release keystores or .env are tracked in git
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -qE '(^|/)\.env$|\.(jks|keystore)$'; then
            echo "Error: Signing keystores or .env must not be committed to a public release tag."
            exit 1
          fi

      - name: Verify release signing secrets are configured
        shell: bash
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Error: Missing release signing secrets (UPLOAD_KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD)."
            echo "Refusing to publish a debug APK as a stable release."
            exit 1
          fi

      - name: Run offline unit and Robolectric tests
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest \
            --tests "com.example.ExampleUnitTest" \
            --tests "com.example.ExampleRobolectricTest" \
            --tests "com.example.data.preferences.*" \
            --tests "com.example.domain.*" \
            --tests "com.example.notifications.*"

      - name: Decode Release Keystore and Build Signed Release APK & AAB
        shell: bash
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$UPLOAD_KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 --decode > my-upload-key.jks
          if [ ! -s my-upload-key.jks ]; then
            echo "Error: Decoded release keystore is empty."
            exit 1
          fi
          export KEYSTORE_PATH="${{ github.workspace }}/my-upload-key.jks"
          gradle :app:assembleRelease :app:bundleRelease

      - name: Verify Signed Release APK & AAB and Compute SHA-256 Checksums
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.tag_info.outputs.tag }}"
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Release APK not found at $APK_PATH"
            exit 1
          fi
          if [ ! -f "$AAB_PATH" ]; then
            echo "Error: Release AAB not found at $AAB_PATH"
            exit 1
          fi

          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_DIR" ] || [ ! -d "$SDK_DIR" ]; then
            echo "Error: ANDROID_HOME / ANDROID_SDK_ROOT is not set; cannot locate apksigner."
            exit 1
          fi

          find_apksigner() {
            find "$SDK_DIR/build-tools" -maxdepth 2 \( -type f -o -type l \) -name apksigner 2>/dev/null | sort -V | tail -n 1 || true
          }

          APKSIGNER="$(find_apksigner)"
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -maxdepth 3 \( -type f -o -type l \) -name sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)"
            if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
              echo "apksigner not found; installing Android SDK build-tools;36.0.0..."
              yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
              "$SDKMANAGER" "build-tools;36.0.0"
              APKSIGNER="$(find_apksigner)"
            fi
          fi

          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "Error: apksigner not found under $SDK_DIR/build-tools; refusing to publish without APK signature verification."
            exit 1
          fi

          echo "Verifying APK signature with $APKSIGNER..."
          APK_VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK_PATH")"
          echo "$APK_VERIFY_OUTPUT"
          if echo "$APK_VERIFY_OUTPUT" | grep -qi "CN=Android Debug"; then
            echo "Error: Release APK is signed with the Android Debug certificate; refusing to publish."
            exit 1
          fi

          if ! command -v jarsigner >/dev/null 2>&1; then
            echo "Error: jarsigner not found; refusing to publish without AAB signature verification."
            exit 1
          fi

          echo "Verifying AAB signature with jarsigner..."
          AAB_VERIFY_OUTPUT="$(jarsigner -verify -verbose:summary -certs "$AAB_PATH")"
          echo "$AAB_VERIFY_OUTPUT"
          if ! echo "$AAB_VERIFY_OUTPUT" | grep -q "jar verified." || echo "$AAB_VERIFY_OUTPUT" | grep -qi "jar is unsigned"; then
            echo "Error: Release AAB signature verification failed."
            exit 1
          fi
          if echo "$AAB_VERIFY_OUTPUT" | grep -qi "CN=Android Debug"; then
            echo "Error: Release AAB is signed with the Android Debug certificate; refusing to publish."
            exit 1
          fi

          mkdir -p release-artifacts
          cp "$APK_PATH" "release-artifacts/food-expenses-${TAG}-release.apk"
          cp "$AAB_PATH" "release-artifacts/food-expenses-${TAG}-release.aab"
          cd release-artifacts
          sha256sum "food-expenses-${TAG}-release.apk" "food-expenses-${TAG}-release.aab" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Cleanup Temporary Keystore
        if: always()
        run: rm -f my-upload-key.jks

      - name: Publish Stable GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: "Food Expenses ${{ steps.tag_info.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/*
